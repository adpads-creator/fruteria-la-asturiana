name: Deploy

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      BUCKET: s3://fruteria-la-asturiana-985124893669
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::985124893669:role/fruteria-la-asturiana-github-deploy
          aws-region: eu-west-1
      - name: Upload assets (long cache)
        run: aws s3 sync dist/ $BUCKET --exclude "*.html" --exclude "gallery/*" --exclude "gallery.json" --exclude "hero.json" --exclude "admin-config.json" --cache-control "public,max-age=31536000,immutable"
      - name: Upload HTML (no cache)
        run: aws s3 cp dist/ $BUCKET/ --recursive --exclude "*" --include "*.html" --cache-control "no-cache" --content-type "text/html; charset=utf-8"
      # Las fotos (gallery/*, *.json) las gestiona el panel o Terraform: nunca se borran desde aquí.
      - name: Remove obsolete files
        run: aws s3 sync dist/ $BUCKET --delete --exclude "*.html" --exclude "gallery/*" --exclude "gallery.json" --exclude "hero.json" --exclude "admin-config.json"
      - run: aws cloudfront create-invalidation --distribution-id E1KD9JWA5FDJRH --paths "/" "/index.html" "/admin.html"