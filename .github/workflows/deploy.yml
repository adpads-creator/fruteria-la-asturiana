name: Deploy

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::985124893669:role/fruteria-la-asturiana-github-deploy
          aws-region: eu-west-1
      - name: Upload assets (long cache)
        run: aws s3 sync dist/ s3://fruteria-la-asturiana-985124893669 --exclude "*.html" --cache-control "public,max-age=31536000,immutable"
      - name: Upload HTML (no cache)
        run: aws s3 cp dist/ s3://fruteria-la-asturiana-985124893669/ --recursive --exclude "*" --include "*.html" --cache-control "no-cache" --content-type "text/html; charset=utf-8"
      - name: Remove obsolete files
        run: aws s3 sync dist/ s3://fruteria-la-asturiana-985124893669 --delete --exclude "*.html" --exclude "gallery/*" --exclude gallery.json --exclude admin-config.json
      - run: aws cloudfront create-invalidation --distribution-id E1KD9JWA5FDJRH --paths "/" "/index.html" "/admin.html"
